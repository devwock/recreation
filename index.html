<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>레크리에이션 관리</title>
  <style>
    :root {
      --bg: #f6f5f2;
      --surface: #ffffff;
      --text: #1d1d1f;
      --muted: #6b6b70;
      --border: #e3e1dc;
      --accent: #2f7d4f;
      --accent-soft: #e4f1e8;
      --badge-wait-bg: #f1efe9;
      --badge-wait-text: #7a6f58;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141416;
        --surface: #1e1e21;
        --text: #ececee;
        --muted: #9a9aa1;
        --border: #2e2e33;
        --accent: #5cc285;
        --accent-soft: #1d3326;
        --badge-wait-bg: #2a2823;
        --badge-wait-text: #c9b98f;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
      line-height: 1.5;
    }
    .wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 48px 16px 64px;
    }
    header h1 {
      margin: 0 0 4px;
      font-size: 28px;
      letter-spacing: -0.02em;
    }
    header p {
      margin: 0;
      color: var(--muted);
    }
    h2 {
      margin: 40px 0 16px;
      font-size: 16px;
      color: var(--muted);
      font-weight: 600;
    }
    .games {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }
    .game {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: inherit;
      text-decoration: none;
      transition: border-color .15s, transform .15s;
    }
    a.game:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .game[aria-disabled="true"] {
      cursor: default;
    }
    .game-head {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .game-icon {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      font-size: 24px;
      background: var(--accent-soft);
      border-radius: 10px;
    }
    .game-title {
      margin: 0;
      font-size: 18px;
    }
    .game-desc {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      flex: 1;
    }
    .badge {
      align-self: flex-start;
      padding: 2px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .badge.wait {
      background: var(--badge-wait-bg);
      color: var(--badge-wait-text);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>레크리에이션 관리</h1>
      <p>진행할 게임을 선택하세요.</p>
    </header>

    <h2>게임 목록</h2>
    <div class="games" id="games"></div>
  </div>

  <script src="games/games.js"></script>
  <script>
    // 게임 목록은 games/games.js 에서 등록한다.
    const GAMES = window.GAMES || [];

    const list = document.getElementById('games');
    if (!GAMES.length) {
      list.innerHTML = '<p class="game-desc">등록된 게임이 없습니다. games/games.js 를 확인하세요.</p>';
    }
    for (const g of GAMES) {
      const href = g.file ? 'games/' + g.file : null;
      const el = document.createElement(href ? 'a' : 'div');
      el.className = 'game';
      if (href) {
        el.href = href;
      } else {
        el.setAttribute('aria-disabled', 'true');
      }
      el.innerHTML = `
        <div class="game-head">
          <div class="game-icon" aria-hidden="true">${g.icon}</div>
          <h3 class="game-title"></h3>
        </div>
        <p class="game-desc"></p>
        <span class="badge ${href ? '' : 'wait'}">${href ? '시작하기' : '준비 중'}</span>
      `;
      el.querySelector('.game-title').textContent = g.title;
      el.querySelector('.game-desc').textContent = g.desc;
      list.appendChild(el);
    }
  </script>
</body>
</html>
